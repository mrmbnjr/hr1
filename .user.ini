; PHP settings read by Hostinger's PHP (LiteSpeed / PHP-FPM). Safe to leave
; in place: unsupported directives are ignored. hPanel > PHP Configuration
; can override any of these.
upload_max_filesize = 8M
post_max_size = 20M
memory_limit = 256M
max_execution_time = 120
expose_php = Off
display_errors = Off
log_errors = On
session.cookie_httponly = 1
session.use_strict_mode = 1
